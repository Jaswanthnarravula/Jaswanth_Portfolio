# Nightly — plans/shared/12 "Gates": the full Playwright matrix (NIGHTLY=1 adds webkit-desktop, iphone-landscape,
# forced-colors, visual and leak, and runs the smoke projects in full), Lighthouse against the Vercel preview when one
# is configured (repository variable PREVIEW_URL), and `npm audit --omit=dev`.
name: Nightly
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run test:e2e:build
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          include-hidden-files: true
          retention-days: 2
          path: |
            .next
            .next-original
            .next-production
            !.next/cache
            !.next-original/cache
            !.next-production/cache

  e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      NIGHTLY: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: builds
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-e2e-${{ matrix.shard }}
          path: |
            playwright-report
            test-results

  lighthouse-preview:
    if: ${{ vars.PREVIEW_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Same routes and assertions as the PR gate (lighthouserc.cjs), against the deployed preview.
      - run: npm run test:perf
        env:
          LHCI_BASE_URL: ${{ vars.PREVIEW_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-preview
          include-hidden-files: true
          path: .lighthouseci
